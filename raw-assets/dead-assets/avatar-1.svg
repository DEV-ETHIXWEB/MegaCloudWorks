<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#F5333B"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5333B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6A3D;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#grad1)"/>
  
  <!-- Simple avatar icon -->
  <circle cx="200" cy="150" r="60" fill="white" opacity="0.9"/>
  <path d="M 200 230 Q 120 250 100 320 L 300 320 Q 280 250 200 230 Z" fill="white" opacity="0.9"/>
  
  <!-- Initials -->
  <text x="200" y="170" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#F5333B" text-anchor="middle">AS</text>
</svg>
