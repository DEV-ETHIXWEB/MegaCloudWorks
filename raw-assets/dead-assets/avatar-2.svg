<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#101014"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#101014;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#56575f;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#grad2)"/>
  
  <!-- Simple avatar icon -->
  <circle cx="200" cy="150" r="60" fill="white" opacity="0.15"/>
  <path d="M 200 230 Q 120 250 100 320 L 300 320 Q 280 250 200 230 Z" fill="white" opacity="0.15"/>
  
  <!-- Initials -->
  <text x="200" y="170" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">JD</text>
